schema_version = "1.3"

[task]
name = "local/quantum-programmed-recovery"
version = "0.3.1"
description = "Repair fluorescence reports with outcome-dependent quantum feedback and programmed recovery."
keywords = ["quantum-optics", "open-quantum-systems", "photon-counting", "quantum-instruments", "numerical-physics"]

[agent]
timeout_sec = 3600
user = "solver"

[environment]
build_timeout_sec = 900
cpus = 1
memory_mb = 2048
storage_mb = 4096
gpus = 0
allow_internet = true
network_mode = "public"

[verifier]
timeout_sec = 300
user = "root"
environment_mode = "separate"

[metadata]
difficulty = "medium"
category = "physics"
tags = ["quantum-optics", "counting-statistics", "numpy", "scipy"]
difficulty_status = "ordinary difficulty; not certified as hard"

[[artifacts]]
source = "/app"
destination = "candidate"
exclude = ["__pycache__", "*.pyc", ".venv", ".git"]
